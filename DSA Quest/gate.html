<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/dsa/" />
  <title>DSA Quest</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235560e8'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EDQ%3C/text%3E%3C/svg%3E" />
  <style>
    /* The PIN screen for the hosted copy. Same world as the app (see DESIGN.md): graphite or paper, hairlines, one indigo accent. */
    @font-face { font-family: 'Geist'; src: url('assets/fonts/geist-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('assets/fonts/geist-mono-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root {
      --bg: #08090a; --card: #101113; --raised: #1b1c20; --line: rgba(255, 255, 255, 0.075); --line-strong: rgba(255, 255, 255, 0.13);
      --text: #ececef; --text-2: #a5a5af; --text-3: #8a8a94; --accent: #5560e8; --accent-hover: #6670f3; --ring: rgba(85, 96, 232, 0.38);
      --bad: #f07070; --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f1f1f0; --card: #fafafa; --raised: #f1f1f0; --line: rgba(10, 10, 20, 0.08); --line-strong: rgba(10, 10, 20, 0.14);
        --text: #17171a; --text-2: #4e4e56; --text-3: #686871; --accent-hover: #4a54db; --ring: rgba(85, 96, 232, 0.28); --bad: #c03a3a; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px; background: var(--bg); color: var(--text);
      font: 400 14px/1.5 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; caret-color: var(--accent); }
    ::selection { background: color-mix(in srgb, var(--accent) 38%, transparent); }
    .card { width: min(400px, 100%); padding: 36px 32px 32px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 18px; animation: rise 400ms var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
    .mark { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700; letter-spacing: 0.02em; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
    h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.028em; }
    p { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.6; }
    form { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
    input { width: 100%; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--text);
      font: 500 18px/1 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.3em; transition: border-color 150ms ease-out, box-shadow 150ms ease-out; }
    input::placeholder { color: var(--text-3); letter-spacing: 0.3em; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    input[aria-invalid="true"] { border-color: color-mix(in srgb, var(--bad) 70%, transparent); }
    button { height: 42px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 500 14px 'Geist', ui-sans-serif, system-ui, sans-serif;
      cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 1px 2px rgba(0, 0, 0, 0.3); transition: background-color 150ms ease-out, transform 80ms ease-out; }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .msg { min-height: 20px; font-size: 13px; color: var(--bad); }
    .msg:empty { min-height: 0; }
    .hint { font-size: 13px; color: var(--text-3); }
    .shake { animation: shake 320ms var(--ease); }
    @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) { .card, .shake { animation: none; } input, button { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">DQ</span>
    <h1>DSA Quest</h1>
    <p>Enter your PIN to open it. You only need it once on this device.</p>
    <form id="f" novalidate>
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" placeholder="••••••" autofocus required />
      <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
      <button type="submit" id="go">Unlock</button>
    </form>
    <p class="hint">Your progress saves online, so every device you unlock opens where you left off.</p>
  </main>
  <script>
    const f = document.getElementById('f'), pin = document.getElementById('pin'), msg = document.getElementById('msg'), go = document.getElementById('go');
    const say = text => { msg.textContent = text; pin.setAttribute('aria-invalid', String(!!text)); };
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const value = pin.value.trim();
      if (!value) { say('Enter your PIN.'); pin.focus(); return; }
      go.disabled = true; go.textContent = 'Checking'; say('');
      try {
        const r = await fetch('unlock', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-DQ': '1' }, body: JSON.stringify({ pin: value }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { go.textContent = 'Opening'; location.replace('/dsa'); return; }
        if (d.error === 'locked') say(`Too many wrong tries. Try again in ${d.minutes} minute${d.minutes === 1 ? '' : 's'}.`);
        else if (d.error === 'not-configured') say('The PIN is not set up on the server yet.');
        else say(d.left > 0 && d.left <= 3 ? `That PIN did not match. ${d.left} ${d.left === 1 ? 'try' : 'tries'} left before a short lock.` : 'That PIN did not match.');
      } catch (err) { say('Could not reach the server. Check your connection and try again.'); }
      f.classList.remove('shake'); void f.offsetWidth; if (msg.textContent) f.classList.add('shake');
      go.disabled = false; go.textContent = 'Unlock'; pin.select();
    });
  </script>
</body>
</html>
